<text x="735" y="660" fill="#555" text-anchor="middle" font-size="14">Xám = dây nối trước, xanh lục = dây nối sau khi lắp từng bước. D1 nối GND qua 220 Ω nên chỉ chữ số đầu sáng.</text>
<text x="735" y="683" fill="#555" text-anchor="middle" font-size="14">Q0–Q7 → A, F, B, G, C, DP, D, E. Tím = dây điều khiển. Chỗ dây vòng qua là hai dây chéo nhau, không nối.</text>
