<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="Helvetica, Arial, sans-serif" font-size="16">
<rect width="960" height="700" fill="#fff"/>

<!-- Stepper motor 28BYJ-48 -->
<text x="150" y="32" fill="#222" text-anchor="middle" font-weight="bold">Động cơ bước 28BYJ-48 (5 V)</text>
<rect x="55" y="111" width="190" height="18" rx="9" fill="#b9bdc2" stroke="#888"/>
<circle cx="68" cy="120" r="5" fill="#fff" stroke="#888"/>
<circle cx="232" cy="120" r="5" fill="#fff" stroke="#888"/>
<circle cx="150" cy="120" r="66" fill="#c9cdd2" stroke="#888" stroke-width="2"/>
<circle cx="150" cy="96" r="16" fill="#e4e6e9" stroke="#999"/>
<circle cx="150" cy="96" r="7" fill="#d4af37" stroke="#8a6d10"/>
<rect x="146" y="89" width="8" height="3" fill="#8a6d10"/>
<text x="150" y="152" fill="#555" text-anchor="middle" font-size="12">trục ra (qua hộp số 1:64)</text>
<rect x="115" y="180" width="70" height="30" rx="4" fill="#2a5db0" stroke="#1b3f7a"/>

<!-- motor cable: blue, pink, yellow, orange, red -->
<g fill="none" stroke-width="5" stroke-linecap="round">
  <path d="M125 210 V256" stroke="#1f5fbf"/>
  <path d="M137.5 210 V256" stroke="#ff8fb1"/>
  <path d="M150 210 V256" stroke="#f1c40f"/>
  <path d="M162.5 210 V256" stroke="#e67e22"/>
  <path d="M175 210 V256" stroke="#d62828"/>
</g>
<text x="200" y="236" fill="#555" font-size="13">jack 5 chân có khấc, chỉ cắm được một chiều</text>

<!-- ULN2003 driver board -->
<rect x="40" y="262" width="260" height="280" rx="10" fill="#2e7d32" stroke="#1b5e20"/>
<rect x="110" y="254" width="80" height="24" rx="3" fill="#f2f2f2" stroke="#999"/>
<circle cx="56" cy="278" r="6" fill="#fff"/>
<circle cx="56" cy="526" r="6" fill="#fff"/>
<rect x="72" y="320" width="60" height="150" rx="3" fill="#1d1d1f" stroke="#000"/>
<text x="102" y="395" fill="#ddd" font-size="13" text-anchor="middle" transform="rotate(-90 102 395)">ULN2003</text>
<g fill="#ff3b30" stroke="#8a1c16">
  <circle cx="170" cy="330" r="8"/>
  <circle cx="170" cy="365" r="8"/>
  <circle cx="170" cy="400" r="8"/>
  <circle cx="170" cy="435" r="8"/>
</g>
<g fill="#fff" font-size="13" font-weight="bold">
  <text x="184" y="335">A</text>
  <text x="184" y="370">B</text>
  <text x="184" y="405">C</text>
  <text x="184" y="440">D</text>
</g>
<g fill="#fff" font-size="15" text-anchor="end" font-weight="bold">
  <text x="292" y="305">IN1</text>
  <text x="292" y="345">IN2</text>
  <text x="292" y="385">IN3</text>
  <text x="292" y="425">IN4</text>
  <text x="292" y="475">+</text>
  <text x="292" y="515">−</text>
</g>
<text x="170" y="520" fill="#fff" text-anchor="middle" font-weight="bold">Driver ULN2003</text>
<g fill="#c9a227" stroke="#8a6d10">
  <rect x="300" y="294" width="24" height="12"/>
  <rect x="300" y="334" width="24" height="12"/>
  <rect x="300" y="374" width="24" height="12"/>
  <rect x="300" y="414" width="24" height="12"/>
  <rect x="300" y="464" width="24" height="12"/>
  <rect x="300" y="504" width="24" height="12"/>
</g>

<!-- Breadboard rails -->
<rect x="360" y="582" width="290" height="16" rx="3" fill="#fde2e2" stroke="#d62828" stroke-width="2"/>
<rect x="310" y="612" width="380" height="16" rx="3" fill="#e3e8f5" stroke="#1d3f8f" stroke-width="2"/>
<text x="485" y="595" fill="#b01e1e" font-size="12" font-weight="bold" text-anchor="middle">thanh + (5 V)</text>
<text x="440" y="625" fill="#1d3f8f" font-size="12" font-weight="bold">thanh − breadboard (GND)</text>

<!-- Potentiometer -->
<circle cx="470" cy="490" r="32" fill="#1f4e9e" stroke="#143466" stroke-width="2"/>
<circle cx="470" cy="490" r="14" fill="#e8e8e8" stroke="#999"/>
<rect x="467" y="477" width="6" height="16" rx="2" fill="#777"/>
<g fill="#c9a227" stroke="#8a6d10">
  <rect x="500" y="455" width="30" height="10"/>
  <rect x="500" y="485" width="30" height="10"/>
  <rect x="500" y="515" width="30" height="10"/>
</g>
<text x="470" y="555" fill="#222" text-anchor="middle" font-size="14" font-weight="bold">Biến trở 10 kΩ</text>

<!-- Wires -->
<g fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
  <!-- control signals -->
  <path d="M324 300 H686" stroke="#8e44ad"/>
  <path d="M324 340 H686" stroke="#e67e22"/>
  <path d="M324 380 H686" stroke="#16a085"/>
  <path d="M324 420 H686" stroke="#2980b9"/>
  <!-- driver power -->
  <path d="M324 470 H375 V590" stroke="#d62828"/>
  <path d="M324 510 H335 V620" stroke="#222"/>
  <!-- potentiometer -->
  <path d="M530 490 H686" stroke="#27ae60"/>
  <path d="M530 520 H560 V590" stroke="#d62828"/>
  <path d="M530 460 H545 V445 H410 V578 M410 602 V620" stroke="#222"/>
  <!-- Uno power -->
  <path d="M686 535 H630 V590" stroke="#d62828"/>
  <path d="M686 570 H665 V620" stroke="#222"/>
</g>
<!-- hop of pot GND wire over + rail -->
<path d="M410 578 A12 12 0 0 1 410 602" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round"/>
<!-- junction dots -->
<g fill="#111">
  <circle cx="375" cy="590" r="5"/>
  <circle cx="335" cy="620" r="5"/>
  <circle cx="560" cy="590" r="5"/>
  <circle cx="410" cy="620" r="5"/>
  <circle cx="630" cy="590" r="5"/>
  <circle cx="665" cy="620" r="5"/>
</g>

<!-- wire labels -->
<g font-size="14" fill="#333" text-anchor="middle">
  <text x="505" y="292">IN1 → D8</text>
  <text x="505" y="332">IN2 → D9</text>
  <text x="505" y="372">IN3 → D10</text>
  <text x="505" y="412">IN4 → D11</text>
  <text x="610" y="482">chân giữa → A0</text>
</g>
<g font-size="13" fill="#333">
  <text x="382" y="460">5V</text>
  <text x="342" y="540">GND</text>
</g>

<!-- Arduino Uno block -->
<text x="815" y="232" fill="#222" text-anchor="middle" font-weight="bold">Arduino Uno</text>
<rect x="700" y="250" width="230" height="340" rx="10" fill="#1f6f8b" stroke="#145063"/>
<g fill="#222" stroke="#000">
  <rect x="686" y="293" width="18" height="14"/>
  <rect x="686" y="333" width="18" height="14"/>
  <rect x="686" y="373" width="18" height="14"/>
  <rect x="686" y="413" width="18" height="14"/>
  <rect x="686" y="483" width="18" height="14"/>
  <rect x="686" y="528" width="18" height="14"/>
  <rect x="686" y="563" width="18" height="14"/>
</g>
<g fill="#fff" font-size="15" font-weight="bold">
  <text x="714" y="305">D8</text>
  <text x="714" y="345">D9</text>
  <text x="714" y="385">D10</text>
  <text x="714" y="425">D11</text>
  <text x="714" y="495">A0</text>
  <text x="714" y="540">5V</text>
  <text x="714" y="575">GND</text>
</g>
<text x="845" y="420" fill="#fff" text-anchor="middle" font-size="20" font-weight="bold">Arduino Uno</text>
<text x="845" y="444" fill="#cfe6ee" text-anchor="middle" font-size="13">(chỉ vẽ các chân dùng)</text>

<!-- footnotes -->
<text x="480" y="660" fill="#555" text-anchor="middle" font-size="14">Driver và biến trở cùng lấy 5V/GND từ hai thanh nguồn breadboard. Biến trở chỉ dùng ở Test 3.</text>
<text x="480" y="684" fill="#555" text-anchor="middle" font-size="14">Chấm đen = điểm cắm vào thanh nguồn. Dây đen của biến trở vòng qua thanh + (không nối).</text>
</svg>
