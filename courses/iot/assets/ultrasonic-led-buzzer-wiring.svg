<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 590" font-family="Helvetica, Arial, sans-serif" font-size="16">
<rect width="1040" height="590" fill="#fff"/>

<!-- Breadboard rails -->
<rect x="30" y="462" width="730" height="16" rx="3" fill="#e3e8f5" stroke="#1d3f8f" stroke-width="2"/>
<rect x="60" y="492" width="730" height="16" rx="3" fill="#fde2e2" stroke="#d62828" stroke-width="2"/>
<text x="200" y="475" fill="#1d3f8f" font-size="12" font-weight="bold" text-anchor="middle">thanh − breadboard (GND)</text>
<text x="200" y="505" fill="#b01e1e" font-size="12" font-weight="bold" text-anchor="middle">thanh + breadboard (5 V)</text>

<!-- HC-SR04 (drawn upside down: pins up) -->
<text x="180" y="390" fill="#222" text-anchor="middle" font-weight="bold">HC-SR04</text>
<text x="180" y="408" fill="#777" text-anchor="middle" font-size="12">vẽ lật ngược, chân hướng lên</text>
<rect x="60" y="250" width="240" height="110" rx="6" fill="#1d3f8f" stroke="#0f2556" stroke-width="2"/>
<g>
  <circle cx="100" cy="310" r="34" fill="#c8c8c8" stroke="#888" stroke-width="2"/>
  <circle cx="100" cy="310" r="22" fill="#8a8a8a" stroke="#b5b04a" stroke-width="3"/>
  <circle cx="260" cy="310" r="34" fill="#c8c8c8" stroke="#888" stroke-width="2"/>
  <circle cx="260" cy="310" r="22" fill="#8a8a8a" stroke="#b5b04a" stroke-width="3"/>
</g>
<rect x="160" y="330" width="40" height="14" rx="7" fill="#bbb" stroke="#888"/>
<g fill="#c9a227" stroke="#8a6d10">
  <rect x="135" y="232" width="10" height="20"/>
  <rect x="160" y="232" width="10" height="20"/>
  <rect x="185" y="232" width="10" height="20"/>
  <rect x="210" y="232" width="10" height="20"/>
</g>
<g fill="#fff" font-size="10" font-weight="bold" text-anchor="end">
  <text transform="translate(144 258) rotate(-90)">GND</text>
  <text transform="translate(169 258) rotate(-90)">ECHO</text>
  <text transform="translate(194 258) rotate(-90)">TRIG</text>
  <text transform="translate(219 258) rotate(-90)">VCC</text>
</g>

<!-- Piezo buzzer -->
<text x="420" y="270" fill="#222" text-anchor="middle" font-weight="bold" font-size="14">Buzzer (piezo)</text>
<g stroke="#9a9a9a" stroke-width="4" stroke-linecap="round">
  <line x1="405" y1="350" x2="405" y2="375"/>
  <line x1="435" y1="350" x2="435" y2="375"/>
</g>
<circle cx="420" cy="320" r="38" fill="#2c2c2e" stroke="#000" stroke-width="2"/>
<circle cx="420" cy="320" r="9" fill="#c9b27a"/>
<g fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">
  <text x="404" y="348">+</text>
  <text x="436" y="348">−</text>
</g>

<!-- LED đỏ + 220 Ω -->
<text x="540" y="312" fill="#222" text-anchor="middle" font-weight="bold" font-size="14">LED đỏ</text>
<g transform="translate(340 146)">
  <path d="M178 232 V196 A22 22 0 0 1 222 196 V232 Z" fill="#e74c3c" stroke="#a93226" stroke-width="2"/>
  <path d="M186 198 A14 14 0 0 1 198 184" fill="none" stroke="#f5b7b1" stroke-width="3" stroke-linecap="round"/>
  <path d="M180 232 H228 V240 H180 Z" fill="#cf3b2c" stroke="#a93226" stroke-width="2"/>
  <g stroke="#9a9a9a" stroke-width="4" stroke-linecap="round">
    <line x1="190" y1="240" x2="190" y2="272"/>
    <line x1="212" y1="240" x2="212" y2="292"/>
  </g>
</g>
<g stroke="#9a9a9a" stroke-width="4" stroke-linecap="round">
  <line x1="610" y1="290" x2="632" y2="290"/><line x1="680" y1="290" x2="702" y2="290"/>
</g>
<rect x="630" y="278" width="52" height="24" rx="10" fill="#e6c79c" stroke="#a07d4f" stroke-width="2"/>
<rect x="638" y="278" width="6" height="24" fill="#d62828"/>
<rect x="649" y="278" width="6" height="24" fill="#d62828"/>
<rect x="660" y="278" width="6" height="24" fill="#7b3f00"/>
<rect x="672" y="278" width="5" height="24" fill="#c9a227"/>
<text x="656" y="270" fill="#222" text-anchor="middle" font-size="13" font-weight="bold">220 Ω</text>

<!-- Wires -->
<g fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
  <!-- sensor signals -->
  <path d="M165 232 V120 H786" stroke="#f1c40f"/>
  <path d="M190 232 V170 H786" stroke="#2980b9"/>
  <!-- buzzer + / LED -->
  <path d="M405 375 V390 H360 V230 H786" stroke="#8e44ad"/>
  <path d="M786 290 H702" stroke="#e67e22"/>
  <path d="M610 290 V452 H552 V438" stroke="#e67e22"/>
  <!-- to − rail -->
  <path d="M140 232 V216 H40 V470" stroke="#222"/>
  <path d="M435 375 V470" stroke="#222"/>
  <path d="M530 418 V470" stroke="#222"/>
  <path d="M786 395 H750 V470" stroke="#222"/>
  <!-- to + rail -->
  <path d="M215 232 V216 H320 V458 M320 482 V500" stroke="#d62828"/>
  <path d="M786 350 H770 V500" stroke="#d62828"/>
</g>
<path d="M320 458 A12 12 0 0 1 320 482" fill="none" stroke="#d62828" stroke-width="6" stroke-linecap="round"/>

<!-- connection dots -->
<g fill="#111">
  <circle cx="610" cy="290" r="5"/><circle cx="702" cy="290" r="5"/>
  <circle cx="552" cy="438" r="5"/><circle cx="530" cy="418" r="5"/>
  <circle cx="405" cy="375" r="5"/><circle cx="435" cy="375" r="5"/>
  <circle cx="40" cy="470" r="5"/><circle cx="435" cy="470" r="5"/>
  <circle cx="530" cy="470" r="5"/><circle cx="750" cy="470" r="5"/>
  <circle cx="320" cy="500" r="5"/><circle cx="770" cy="500" r="5"/>
</g>

<!-- wire labels -->
<g font-size="13" fill="#333" text-anchor="middle">
  <text x="480" y="112">vàng · ECHO → D8 (nối thẳng)</text>
  <text x="480" y="162">xanh dương · TRIG → D7</text>
  <text x="590" y="222">tím · buzzer + → D6</text>
  <text x="743" y="282">cam · D5</text>
  <text x="270" y="208">đỏ · VCC</text>
  <text x="88" y="208">đen · GND</text>
</g>

<!-- Arduino Uno block -->
<text x="915" y="60" fill="#222" text-anchor="middle" font-weight="bold">Arduino Uno</text>
<rect x="800" y="80" width="230" height="350" rx="10" fill="#1f6f8b" stroke="#145063"/>
<g fill="#222" stroke="#000">
  <rect x="786" y="113" width="18" height="14"/>
  <rect x="786" y="163" width="18" height="14"/>
  <rect x="786" y="223" width="18" height="14"/>
  <rect x="786" y="283" width="18" height="14"/>
  <rect x="786" y="343" width="18" height="14"/>
  <rect x="786" y="388" width="18" height="14"/>
</g>
<g fill="#fff" font-size="15" font-weight="bold">
  <text x="814" y="125">D8</text>
  <text x="814" y="175">D7</text>
  <text x="814" y="235">D6</text>
  <text x="814" y="295">D5</text>
  <text x="814" y="355">5V</text>
  <text x="814" y="400">GND</text>
</g>
<text x="935" y="250" fill="#fff" text-anchor="middle" font-size="20" font-weight="bold">Arduino Uno</text>
<text x="935" y="274" fill="#cfe6ee" text-anchor="middle" font-size="13">(chỉ vẽ các chân dùng)</text>

<!-- footnotes -->
<text x="520" y="545" fill="#555" text-anchor="middle" font-size="14">Uno đưa 5V và GND ra hai thanh nguồn. ECHO nối thẳng D8 (Uno chạy 5 V), không cần cầu chia áp như bản Raspberry Pi.</text>
<text x="520" y="568" fill="#555" text-anchor="middle" font-size="14">Chấm đen = điểm cắm. Dây đỏ VCC vòng qua thanh − (không nối). Chân dài LED (anode) nối về phía điện trở.</text>
</svg>
