<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Helvetica, Arial, sans-serif" font-size="16">
<rect width="900" height="460" fill="#fff"/>

<!-- Joystick module -->
<rect x="40" y="60" width="260" height="320" rx="10" fill="#1d1d1f" stroke="#000"/>
<circle cx="58" cy="78" r="7" fill="#fff"/>
<circle cx="58" cy="362" r="7" fill="#fff"/>
<circle cx="230" cy="78" r="7" fill="#fff"/>
<circle cx="230" cy="362" r="7" fill="#fff"/>
<rect x="85" y="135" width="130" height="130" rx="10" fill="#3a3a3d" stroke="#555"/>
<circle cx="150" cy="200" r="58" fill="#4a4a4e" stroke="#6a6a6e" stroke-width="2"/>
<circle cx="150" cy="200" r="38" fill="#111" stroke="#2c2c2e" stroke-width="3"/>
<circle cx="150" cy="200" r="26" fill="none" stroke="#2c2c2e" stroke-width="2"/>
<!-- axis arrows -->
<g stroke="#9ad1ff" stroke-width="2.5" fill="#9ad1ff">
  <line x1="88" y1="300" x2="212" y2="300"/>
  <path d="M84 300 l10 -6 v12 z" stroke="none"/>
  <path d="M216 300 l-10 -6 v12 z" stroke="none"/>
  <line x1="62" y1="142" x2="62" y2="258"/>
  <path d="M62 138 l-6 10 h12 z" stroke="none"/>
  <path d="M62 262 l-6 -10 h12 z" stroke="none"/>
</g>
<text x="150" y="326" fill="#9ad1ff" text-anchor="middle" font-weight="bold">X</text>
<text x="62" y="128" fill="#9ad1ff" text-anchor="middle" font-weight="bold">Y</text>
<text x="150" y="358" fill="#ccc" text-anchor="middle" font-size="13" letter-spacing="2">KY-023 JOYSTICK</text>
<text x="170" y="40" fill="#222" text-anchor="middle" font-weight="bold">Module joystick</text>

<!-- module pin labels + header pins -->
<g fill="#fff" font-size="15" text-anchor="end" font-weight="bold">
  <text x="290" y="125">SW</text>
  <text x="290" y="175">VRy</text>
  <text x="290" y="225">VRx</text>
  <text x="290" y="275">+5V</text>
  <text x="290" y="325">GND</text>
</g>
<g fill="#c9a227" stroke="#8a6d10">
  <rect x="300" y="114" width="24" height="12"/>
  <rect x="300" y="164" width="24" height="12"/>
  <rect x="300" y="214" width="24" height="12"/>
  <rect x="300" y="264" width="24" height="12"/>
  <rect x="300" y="314" width="24" height="12"/>
</g>

<!-- Wires -->
<g stroke-width="6" stroke-linecap="round">
  <line x1="324" y1="120" x2="586" y2="120" stroke="#8e44ad"/>
  <line x1="324" y1="170" x2="586" y2="170" stroke="#27ae60"/>
  <line x1="324" y1="220" x2="586" y2="220" stroke="#e67e22"/>
  <line x1="324" y1="270" x2="586" y2="270" stroke="#d62828"/>
  <line x1="324" y1="320" x2="586" y2="320" stroke="#222"/>
</g>
<g font-size="14" text-anchor="middle" fill="#333">
  <text x="455" y="110">nút nhấn · INPUT_PULLUP</text>
  <text x="455" y="160">trục Y</text>
  <text x="455" y="210">trục X</text>
  <text x="455" y="260">nguồn 5 V</text>
  <text x="455" y="310">mát</text>
</g>

<!-- Arduino Uno block -->
<rect x="600" y="60" width="260" height="320" rx="10" fill="#1f6f8b" stroke="#145063"/>
<g fill="#222" stroke="#000">
  <rect x="586" y="113" width="18" height="14"/>
  <rect x="586" y="163" width="18" height="14"/>
  <rect x="586" y="213" width="18" height="14"/>
  <rect x="586" y="263" width="18" height="14"/>
  <rect x="586" y="313" width="18" height="14"/>
</g>
<g fill="#fff" font-size="15" font-weight="bold">
  <text x="614" y="125">D2</text>
  <text x="614" y="175">A1</text>
  <text x="614" y="225">A0</text>
  <text x="614" y="275">5V</text>
  <text x="614" y="325">GND</text>
</g>
<text x="770" y="214" fill="#fff" text-anchor="middle" font-size="20" font-weight="bold">Arduino Uno</text>
<text x="770" y="238" fill="#cfe6ee" text-anchor="middle" font-size="13">(chỉ vẽ các chân dùng)</text>
<text x="730" y="40" fill="#222" text-anchor="middle" font-weight="bold">Arduino Uno</text>

<text x="450" y="420" fill="#555" text-anchor="middle" font-size="14">5 dây đực – cái: đầu cái cắm vào chân module, đầu đực cắm vào header Uno. Nối theo nhãn in trên module.</text>
<text x="450" y="442" fill="#555" text-anchor="middle" font-size="14">Mũi tên X/Y chỉ trục; chiều tăng/giảm thật xác định bằng Test 1.</text>
</svg>
