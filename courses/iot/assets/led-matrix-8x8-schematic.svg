<text x="650" y="1110" fill="#555" text-anchor="middle" font-size="14">Nâu = 8 dây hàng R1–R8 (cực dương) nối thẳng về Uno. Xanh lục = 8 dây cột C1–C8 (cực âm), mỗi dây qua một điện trở 220 Ω.</text>
<text x="650" y="1133" fill="#555" text-anchor="middle" font-size="14">Chân Uno xếp theo thứ tự cho dây không chéo nhau, không theo vị trí thật trên board. Mạch không dùng 5V/GND.</text>
