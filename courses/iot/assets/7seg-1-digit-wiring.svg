<!-- footnotes -->
<text x="480" y="625" fill="#555" text-anchor="middle" font-size="14">Mỗi chân thanh đi qua một điện trở 220 Ω riêng (đỏ-đỏ-nâu). Số trong ngoặc là số chân trên vỏ 5161AS.</text>
<text x="480" y="648" fill="#555" text-anchor="middle" font-size="14">5161BS (anode chung): nối COM lên 5V thay vì GND. Nút nhấn cắm chéo, dùng INPUT_PULLUP nên không cần điện trở.</text>
