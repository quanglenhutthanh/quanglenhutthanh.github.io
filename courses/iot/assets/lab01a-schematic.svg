<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Helvetica, Arial, sans-serif" font-size="16">
<rect width="960" height="470" fill="#fff"/>

<!-- Wires (colours match the wiring diagram) -->
<g fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M686 150 H580" stroke="#e67e22"/>
  <path d="M470 150 H220 V196" stroke="#27ae60"/>
  <path d="M220 244 V360 H686" stroke="#222"/>
</g>

<!-- R1: zigzag symbol -->
<polyline points="580,150 568,150 561,132 547,168 533,132 519,168 505,132 491,168 484,150 470,150" fill="none" stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="525" y="112" fill="#222" text-anchor="middle" font-weight="bold">R1 · 1 kΩ</text>
<text x="525" y="194" fill="#777" text-anchor="middle" font-size="12">điện trở · nâu – đen – đỏ – nhũ</text>

<!-- D1: LED symbol (anode on top, cathode bar at bottom) -->
<polygon points="194,200 246,200 220,240" fill="#f4d03f" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
<line x1="194" y1="242" x2="246" y2="242" stroke="#222" stroke-width="4" stroke-linecap="round"/>
<g stroke="#e67e22" stroke-width="2.5" fill="#e67e22" stroke-linecap="round">
  <line x1="256" y1="222" x2="276" y2="204"/>
  <path d="M281 199 l-11 3 l7 7 z" stroke="none"/>
  <line x1="264" y1="236" x2="284" y2="218"/>
  <path d="M289 213 l-11 3 l7 7 z" stroke="none"/>
</g>
<text x="182" y="226" fill="#222" text-anchor="end" font-weight="bold">D1 · LED vàng</text>
<g font-size="13" fill="#333">
  <text x="182" y="198" text-anchor="end">anode (+)</text>
  <text x="182" y="262" text-anchor="end">cathode (−)</text>
</g>

<!-- current direction -->
<g fill="#e67e22">
  <path d="M630 150 l12 -7 v14 z"/>
</g>
<g fill="#27ae60">
  <path d="M340 150 l12 -7 v14 z"/>
</g>
<g fill="#222">
  <path d="M472 360 l-12 -7 v14 z"/>
</g>
<g font-size="14" fill="#333">
  <text x="633" y="134" text-anchor="middle">D13 → R1</text>
  <text x="346" y="134" text-anchor="middle">I ≈ 3 mA</text>
  <text x="466" y="346" text-anchor="middle">cathode → GND</text>
</g>

<!-- Arduino Uno block -->
<text x="815" y="60" fill="#222" text-anchor="middle" font-weight="bold">Arduino Uno</text>
<rect x="700" y="80" width="230" height="320" rx="10" fill="#1f6f8b" stroke="#145063"/>
<g fill="#222" stroke="#000">
  <rect x="686" y="143" width="18" height="14"/>
  <rect x="686" y="353" width="18" height="14"/>
</g>
<g fill="#fff" font-size="15" font-weight="bold">
  <text x="714" y="155">D13</text>
  <text x="714" y="365">GND</text>
</g>
<text x="830" y="240" fill="#fff" text-anchor="middle" font-size="20" font-weight="bold">Arduino Uno</text>
<text x="830" y="264" fill="#cfe6ee" text-anchor="middle" font-size="13">(chỉ vẽ các chân dùng)</text>

<!-- footnotes -->
<text x="480" y="432" fill="#555" text-anchor="middle" font-size="14">Mạch nối tiếp: D13 → R1 → LED → GND. Khi D13 = HIGH: I = (5 V − 2 V) / 1 kΩ ≈ 3 mA.</text>
<text x="480" y="455" fill="#555" text-anchor="middle" font-size="14">Sơ đồ nguyên lý dùng ký hiệu điện; màu dây giống sơ đồ nối dây ở trên (cam, xanh lá, đen).</text>
</svg>
