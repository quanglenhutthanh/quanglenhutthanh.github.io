<text x="735" y="770" fill="#555" text-anchor="middle" font-size="14">Xanh lục = 8 dây đoạn Q0–Q7 → A…G, DP (giữ như bản một số). Nâu = 4 dây chọn chữ số, mỗi dây qua 220 Ω về D2–D5.</text>
<text x="735" y="793" fill="#555" text-anchor="middle" font-size="14">Tím = 3 dây điều khiển 74HC595. Chỗ dây vòng qua là hai dây chéo nhau, không nối. Chấm đen = điểm cắm vào thanh nguồn.</text>
