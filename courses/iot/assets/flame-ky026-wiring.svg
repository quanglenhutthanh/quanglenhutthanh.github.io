<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 730" font-family="Helvetica, Arial, sans-serif" font-size="16">
<rect width="960" height="730" fill="#fff"/>

<!-- Flame + IR rays -->
<path d="M42 150 C22 175 24 205 42 215 C60 205 62 175 42 150 Z" fill="#ff8c1a" stroke="#c45a00" stroke-width="2"/>
<path d="M42 178 C33 192 34 206 42 211 C50 206 51 192 42 178 Z" fill="#ffd54a"/>
<rect x="39" y="215" width="6" height="22" fill="#777"/>
<g stroke="#c0392b" stroke-width="2" stroke-dasharray="5 5" fill="none">
  <path d="M48 240 L58 330"/>
  <path d="M56 236 L72 330"/>
</g>
<text x="80" y="200" fill="#555" font-size="13">hồng ngoại ~760–1100 nm</text>

<!-- KY-026 module -->
<text x="210" y="248" fill="#222" text-anchor="middle" font-weight="bold">Module cảm biến lửa KY-026</text>
<!-- IR eye on bent legs -->
<line x1="78" y1="352" x2="120" y2="352" stroke="#999" stroke-width="3"/>
<line x1="78" y1="368" x2="120" y2="368" stroke="#999" stroke-width="3"/>
<path d="M78 344 V376 H62 A16 16 0 0 1 62 344 Z" fill="#111" stroke="#000"/>
<rect x="76" y="340" width="6" height="40" rx="1" fill="#222"/>
<text x="62" y="406" fill="#555" font-size="12" text-anchor="middle">mắt IR</text>
<text x="62" y="421" fill="#555" font-size="12" text-anchor="middle">(vỏ đen)</text>

<rect x="120" y="262" width="180" height="196" rx="8" fill="#2b2b2b" stroke="#000"/>
<circle cx="134" cy="276" r="5" fill="#fff"/>
<circle cx="134" cy="444" r="5" fill="#fff"/>
<!-- potentiometer -->
<rect x="146" y="284" width="40" height="40" rx="3" fill="#1f5fbf" stroke="#143466"/>
<circle cx="166" cy="304" r="10" fill="#d4af37" stroke="#8a6d10"/>
<rect x="160" y="302" width="12" height="4" fill="#8a6d10"/>
<text x="166" y="340" fill="#ddd" font-size="11" text-anchor="middle">ngưỡng D0</text>
<!-- LM393 -->
<rect x="200" y="290" width="44" height="56" rx="2" fill="#111" stroke="#666"/>
<text x="222" y="322" fill="#ccc" font-size="10" text-anchor="middle">LM393</text>
<!-- LEDs -->
<circle cx="170" cy="400" r="7" fill="#ff3b30" stroke="#8a1c16"/>
<circle cx="214" cy="400" r="7" fill="#ff3b30" stroke="#8a1c16"/>
<g fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">
  <text x="170" y="424">L1</text>
  <text x="214" y="424">L2</text>
</g>
<text x="192" y="440" fill="#bbb" font-size="10" text-anchor="middle">nguồn · có lửa</text>
<g fill="#fff" font-size="15" text-anchor="end" font-weight="bold">
  <text x="292" y="305">A0</text>
  <text x="292" y="345">G</text>
  <text x="292" y="385">+</text>
  <text x="292" y="425">D0</text>
</g>
<g fill="#c9a227" stroke="#8a6d10">
  <rect x="300" y="294" width="24" height="12"/>
  <rect x="300" y="334" width="24" height="12"/>
  <rect x="300" y="374" width="24" height="12"/>
  <rect x="300" y="414" width="24" height="12"/>
</g>

<!-- Breadboard rails -->
<rect x="360" y="612" width="300" height="16" rx="3" fill="#fde2e2" stroke="#d62828" stroke-width="2"/>
<rect x="320" y="642" width="360" height="16" rx="3" fill="#e3e8f5" stroke="#1d3f8f" stroke-width="2"/>
<text x="420" y="625" fill="#b01e1e" font-size="12" font-weight="bold">thanh + (5 V)</text>
<text x="400" y="655" fill="#1d3f8f" font-size="12" font-weight="bold">thanh − (GND)</text>

<!-- Resistor 220 -->
<rect x="596" y="460" width="56" height="20" rx="6" fill="#e8d2a6" stroke="#9c7c46"/>
<g>
  <rect x="606" y="460" width="5" height="20" fill="#d62828"/>
  <rect x="616" y="460" width="5" height="20" fill="#d62828"/>
  <rect x="626" y="460" width="5" height="20" fill="#7a4a1f"/>
  <rect x="640" y="460" width="4" height="20" fill="#c9a227"/>
</g>
<text x="624" y="452" fill="#333" font-size="13" text-anchor="middle">220 Ω</text>

<!-- Red LED -->
<path d="M506 486 V462 A14 14 0 0 1 534 462 V486 Z" fill="#ff4d4d" stroke="#a11d1d" stroke-width="2"/>
<rect x="502" y="486" width="36" height="5" fill="#a11d1d"/>
<text x="470" y="450" fill="#222" font-size="14" font-weight="bold" text-anchor="middle">LED đỏ</text>

<!-- Buzzer -->
<circle cx="580" cy="540" r="24" fill="#1d1d1f" stroke="#000"/>
<circle cx="580" cy="540" r="5" fill="#555"/>
<text x="580" y="510" fill="#222" font-size="12" font-weight="bold" text-anchor="middle">+</text>
<text x="610" y="548" fill="#222" font-size="14" font-weight="bold">Buzzer</text>

<!-- Wires -->
<g fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
  <!-- module power -->
  <path d="M324 340 H340 V650" stroke="#222"/>
  <path d="M324 380 H380 V620" stroke="#d62828"/>
  <!-- analog -->
  <path d="M324 300 H686" stroke="#27ae60"/>
  <!-- LED: D6 -> resistor -> anode, cathode -> GND (hops over + rail) -->
  <path d="M686 470 H652" stroke="#e67e22"/>
  <path d="M596 470 H534" stroke="#e67e22"/>
  <path d="M520 491 V608 M520 632 V650" stroke="#222"/>
  <!-- buzzer: D7 -> +, - -> GND (hops over + rail) -->
  <path d="M686 520 H600" stroke="#8e44ad"/>
  <path d="M580 564 V608 M580 632 V650" stroke="#222"/>
  <!-- Uno power -->
  <path d="M686 560 H630 V620" stroke="#d62828"/>
  <path d="M686 590 H670 V650" stroke="#222"/>
</g>
<!-- digital wire with hops over the module power wires -->
<path d="M324 420 H328 A12 12 0 0 1 352 420 H368 A12 12 0 0 1 392 420 H686" fill="none" stroke="#2980b9" stroke-width="6" stroke-linecap="round"/>
<!-- hops over + rail -->
<g fill="none" stroke="#222" stroke-width="6" stroke-linecap="round">
  <path d="M520 608 A12 12 0 0 1 520 632"/>
  <path d="M580 608 A12 12 0 0 1 580 632"/>
</g>
<!-- junction dots -->
<g fill="#111">
  <circle cx="340" cy="650" r="5"/>
  <circle cx="380" cy="620" r="5"/>
  <circle cx="520" cy="650" r="5"/>
  <circle cx="580" cy="650" r="5"/>
  <circle cx="630" cy="620" r="5"/>
  <circle cx="670" cy="650" r="5"/>
</g>

<!-- wire labels -->
<g font-size="14" fill="#333" text-anchor="middle">
  <text x="505" y="292">A0 → A0 (analog)</text>
  <text x="540" y="412">D0 → D2 (digital)</text>
  <text x="670" y="462">D6</text>
  <text x="645" y="512">D7</text>
</g>
<g font-size="13" fill="#333">
  <text x="387" y="520">5V</text>
  <text x="300" y="560">GND</text>
</g>

<!-- Arduino Uno block -->
<text x="815" y="232" fill="#222" text-anchor="middle" font-weight="bold">Arduino Uno</text>
<rect x="700" y="250" width="230" height="370" rx="10" fill="#1f6f8b" stroke="#145063"/>
<g fill="#222" stroke="#000">
  <rect x="686" y="293" width="18" height="14"/>
  <rect x="686" y="413" width="18" height="14"/>
  <rect x="686" y="463" width="18" height="14"/>
  <rect x="686" y="513" width="18" height="14"/>
  <rect x="686" y="553" width="18" height="14"/>
  <rect x="686" y="583" width="18" height="14"/>
</g>
<g fill="#fff" font-size="15" font-weight="bold">
  <text x="714" y="305">A0</text>
  <text x="714" y="425">D2</text>
  <text x="714" y="475">D6</text>
  <text x="714" y="525">D7</text>
  <text x="714" y="565">5V</text>
  <text x="714" y="595">GND</text>
</g>
<text x="845" y="380" fill="#fff" text-anchor="middle" font-size="20" font-weight="bold">Arduino Uno</text>
<text x="845" y="404" fill="#cfe6ee" text-anchor="middle" font-size="13">(chỉ vẽ các chân dùng)</text>

<!-- footnotes -->
<text x="480" y="690" fill="#555" text-anchor="middle" font-size="14">Module, LED và buzzer lấy 5V/GND qua hai thanh nguồn breadboard. LED và buzzer chỉ dùng ở Test 3.</text>
<text x="480" y="714" fill="#555" text-anchor="middle" font-size="14">Chấm đen = điểm cắm vào thanh nguồn. Chỗ dây uốn vòng = vắt qua dây khác, không nối.</text>
</svg>
