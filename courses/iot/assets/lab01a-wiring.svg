<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" font-family="Helvetica, Arial, sans-serif" font-size="16">
<rect width="960" height="510" fill="#fff"/>

<!-- LED D1 -->
<text x="200" y="150" fill="#222" text-anchor="middle" font-weight="bold">D1 · LED vàng 5 mm</text>
<path d="M178 232 V196 A22 22 0 0 1 222 196 V232 Z" fill="#f4d03f" stroke="#b7950b" stroke-width="2"/>
<path d="M186 198 A14 14 0 0 1 198 184" fill="none" stroke="#fff6c8" stroke-width="3" stroke-linecap="round"/>
<path d="M180 232 H228 V240 H180 Z" fill="#e5c235" stroke="#b7950b" stroke-width="2"/>
<line x1="180" y1="229" x2="180" y2="243" stroke="#b7950b" stroke-width="3"/>
<!-- legs: cathode (short, left), anode (long, right) -->
<g stroke="#9a9a9a" stroke-width="4" stroke-linecap="round" fill="none">
  <line x1="190" y1="240" x2="190" y2="272"/>
  <line x1="212" y1="240" x2="212" y2="292"/>
</g>
<g font-size="13" fill="#333">
  <text x="168" y="266" text-anchor="end">cathode (−)</text>
  <text x="168" y="282" text-anchor="end" fill="#777" font-size="12">chân ngắn, mép vát</text>
  <text x="236" y="266">anode (+)</text>
  <text x="236" y="282" fill="#777" font-size="12">chân dài</text>
</g>

<!-- Resistor R1 -->
<text x="386" y="292" fill="#222" text-anchor="middle" font-weight="bold">R1 · 1 kΩ</text>
<g stroke="#9a9a9a" stroke-width="4" stroke-linecap="round">
  <line x1="318" y1="320" x2="342" y2="320"/>
  <line x1="430" y1="320" x2="454" y2="320"/>
</g>
<rect x="340" y="306" width="92" height="28" rx="11" fill="#e6c79c" stroke="#a07d4f" stroke-width="2"/>
<g>
  <rect x="353" y="306" width="8" height="28" fill="#7b3f00"/>
  <rect x="369" y="306" width="8" height="28" fill="#111"/>
  <rect x="385" y="306" width="8" height="28" fill="#d62828"/>
  <rect x="410" y="306" width="8" height="28" fill="#c9a227"/>
</g>
<text x="386" y="356" fill="#777" text-anchor="middle" font-size="12">nâu – đen – đỏ – nhũ</text>

<!-- Wires -->
<g fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M686 180 H540 V320 H454" stroke="#e67e22"/>
  <path d="M318 320 H212 V292" stroke="#27ae60"/>
  <path d="M190 272 V400 H686" stroke="#222"/>
</g>
<!-- connection dots -->
<g fill="#111">
  <circle cx="454" cy="320" r="5"/>
  <circle cx="318" cy="320" r="5"/>
  <circle cx="212" cy="292" r="5"/>
  <circle cx="190" cy="272" r="5"/>
</g>

<!-- wire labels -->
<g font-size="14" fill="#333">
  <text x="612" y="170" text-anchor="middle">cam · D13 → R1</text>
  <text x="265" y="342" text-anchor="middle" font-size="13">R1 → anode</text>
  <text x="440" y="390" text-anchor="middle">đen · cathode → GND</text>
</g>
<!-- current direction arrows -->
<g fill="#e67e22">
  <path d="M570 180 l12 -7 v14 z"/>
</g>
<g fill="#222">
  <path d="M572 400 l-12 -7 v14 z"/>
</g>

<!-- Arduino Uno block -->
<text x="815" y="60" fill="#222" text-anchor="middle" font-weight="bold">Arduino Uno</text>
<rect x="700" y="80" width="230" height="350" rx="10" fill="#1f6f8b" stroke="#145063"/>
<g fill="#222" stroke="#000">
  <rect x="686" y="173" width="18" height="14"/>
  <rect x="686" y="393" width="18" height="14"/>
</g>
<g fill="#fff" font-size="15" font-weight="bold">
  <text x="714" y="185">D13</text>
  <text x="714" y="405">GND</text>
</g>
<!-- on-board L LED -->
<rect x="764" y="174" width="18" height="10" rx="2" fill="#f4d03f" stroke="#b7950b"/>
<text x="790" y="184" fill="#cfe6ee" font-size="12">đèn L (nối sẵn D13)</text>
<text x="830" y="270" fill="#fff" text-anchor="middle" font-size="20" font-weight="bold">Arduino Uno</text>
<text x="830" y="294" fill="#cfe6ee" text-anchor="middle" font-size="13">(chỉ vẽ các chân dùng)</text>

<!-- footnotes -->
<text x="480" y="465" fill="#555" text-anchor="middle" font-size="14">Dòng điện đi một vòng: D13 → R1 → anode LED → cathode LED → GND. Mũi tên chỉ chiều dòng khi D13 = HIGH.</text>
<text x="480" y="488" fill="#555" text-anchor="middle" font-size="14">Chấm đen = điểm nối (qua cột chung của breadboard). Mạch không dùng thanh nguồn + / −.</text>
</svg>
