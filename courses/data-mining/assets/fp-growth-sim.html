<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FP-growth Simulator</title>
<style>
:root{--bg:#fafaf8;--card:#f1efe8;--text:#1f1f1d;--muted:#6b6a65;--border:#d3d1c7;--strong:#888780;
--teal-f:#E1F5EE;--teal-s:#0F6E56;--teal-t:#085041;--coral-f:#FAECE7;--coral-s:#993C1D;--coral-t:#712B13;
--pur-f:#EEEDFE;--pur-s:#534AB7;--pur-t:#3C3489;--gray-f:#F1EFE8;--gray-s:#888780;--gray-t:#444441;--ok-bg:#EAF3DE;--ok:#3B6D11}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1b;--card:#2a2a28;--text:#ecebe6;--muted:#a8a69e;--border:#444441;--strong:#888780;
--teal-f:#085041;--teal-s:#5DCAA5;--teal-t:#E1F5EE;--coral-f:#712B13;--coral-s:#F0997B;--coral-t:#FAECE7;
--pur-f:#3C3489;--pur-s:#AFA9EC;--pur-t:#EEEDFE;--gray-f:#2C2C2A;--gray-s:#888780;--gray-t:#D3D1C7;--ok-bg:#27500A;--ok:#C0DD97}}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;font-weight:500;margin:0 0 12px}
button{font:inherit;color:var(--text);background:transparent;border:1px solid var(--strong);border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{background:var(--card)}
.tx{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;font-family:ui-monospace,monospace;font-size:12px}
.tx span{padding:3px 7px;border-radius:8px;border:1px solid var(--border)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin:4px 0 10px;flex-wrap:wrap}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.panel{background:var(--card);border-radius:12px;padding:12px 14px;min-height:150px}
</style>
</head>
<body>
<div class="wrap">
<h1>FP-growth: mô phỏng từng bước</h1>
<div id="tx" class="tx"></div>
<svg id="tree" viewBox="0 0 360 300" width="100%" style="display:block"></svg>
<div class="legend">
<span><span class="sw" style="background:#1D9E75"></span>đang chèn</span>
<span><span class="sw" style="background:#D85A30"></span>item đang khai phá</span>
<span><span class="sw" style="background:#7F77DD"></span>prefix path</span>
</div>
<div class="panel">
<p id="ttl" style="font-weight:500;font-size:15px;margin:0 0 6px"></p>
<div id="desc" style="font-size:14px;line-height:1.6"></div>
</div>
<div style="display:flex;gap:8px;margin-top:12px">
<button id="prev">←</button>
<button id="next" style="flex:1">Bước tiếp →</button>
<button id="reset">Làm lại</button>
</div>
<p id="cnt" style="font-size:12px;color:var(--muted);text-align:center;margin:8px 0 0"></p>
<div style="margin-top:12px;font-size:13px"><span style="color:var(--muted)">Frequent itemsets đã tìm: </span><span id="res" style="font-family:ui-monospace,monospace"></span></div>
</div>
<script>
const RAW=['f,a,c,d,g,i,m,p','a,b,c,f,l,m,o','b,f,h,j,o','b,c,k,s,p','a,f,c,e,l,p,m,n'];
const T=[['f','c','a','m','p'],['f','c','a','b','m'],['f','b'],['c','b','p'],['f','c','a','m','p']];
const S=[
{t:'count',ttl:'Bước 0: Quét DB lần 1, đếm support',d:'Đếm số giao dịch chứa mỗi item. Với min_sup = 3, giữ lại f:4, c:4, a:3, b:3, m:3, p:3; các item khác (d, g, i, l, o...) bị loại.<br><br>Sắp theo support giảm dần ta được F-list: <b>f, c, a, b, m, p</b>. Mỗi giao dịch được lọc và sắp lại theo thứ tự này.'},
{t:'ins',k:1,ttl:'Chèn T1: f,c,a,m,p',d:'Cây đang rỗng nên tạo một nhánh mới toanh: f → c → a → m → p, mỗi node count = 1.'},
{t:'ins',k:2,ttl:'Chèn T2: f,c,a,b,m',d:'Prefix f,c,a trùng với đường đã có, nên đi theo đường cũ và cộng count (f:2, c:2, a:2).<br>Đến b thì không còn trùng, nên rẽ nhánh mới: a → b:1 → m:1.'},
{t:'ins',k:3,ttl:'Chèn T3: f,b',d:'f trùng, nên f:3.<br>Dưới f chưa có b, nên tạo nhánh mới f → b:1.'},
{t:'ins',k:4,ttl:'Chèn T4: c,b,p',d:'Giao dịch này không bắt đầu bằng f, nên phải tạo nhánh mới từ root: c:1 → b:1 → p:1.<br><br>Lưu ý: cây có 2 node c. Header table dùng node-link để nối chúng lại.'},
{t:'ins',k:5,ttl:'Chèn T5: f,c,a,m,p',d:'Trùng hoàn toàn với T1, nên chỉ việc cộng count dọc đường: f:4, c:3, a:3, m:2, p:2.<br><br>Cây đã xong. 5 giao dịch được nén thành 11 node.'},
{t:'mine',it:'p',ttl:'Khai phá p (đi từ cuối F-list)',d:'Các đường dẫn tới p (conditional pattern base):<br>• f,c,a,m : 2<br>• c,b : 1<br>Đếm trong base: c:3, f:2, a:2, m:2, b:1. Chỉ c đạt min_sup.<br>Kết quả: <b>{p}, {c,p}</b>',r:['p','cp']},
{t:'mine',it:'m',ttl:'Khai phá m',d:'Base:<br>• f,c,a : 2<br>• f,c,a,b : 1<br>Đếm: f:3, c:3, a:3, b:1, nên loại b. Conditional tree chỉ còn một đường f–c–a, vì vậy <b>mọi tổ hợp</b> của {f,c,a} ghép với m đều frequent:<br><b>{m}, {fm}, {cm}, {am}, {fcm}, {fam}, {cam}, {fcam}</b>',r:['m','fm','cm','am','fcm','fam','cam','fcam']},
{t:'mine',it:'b',ttl:'Khai phá b',d:'b có 3 node. Base:<br>• f,c,a : 1<br>• f : 1<br>• c : 1<br>Đếm: f:2, c:2, a:1, không item nào đạt 3.<br>Kết quả: chỉ <b>{b}</b>',r:['b']},
{t:'mine',it:'a',ttl:'Khai phá a',d:'Base:<br>• f,c : 3<br>Đếm: f:3, c:3, cả hai đều đạt.<br>Kết quả: <b>{a}, {fa}, {ca}, {fca}</b>',r:['a','fa','ca','fca']},
{t:'mine',it:'c',ttl:'Khai phá c',d:'Có 2 node c. Base:<br>• f : 3<br>• (rỗng, node c nằm ngay dưới root) : 1<br>Đếm: f:3, đạt.<br>Kết quả: <b>{c}, {fc}</b>',r:['c','fc']},
{t:'mine',it:'f',ttl:'Khai phá f',d:'f nằm ngay dưới root nên base rỗng.<br>Kết quả: <b>{f}</b><br><br>Xong! Toàn bộ chỉ cần quét DB 2 lần; phần còn lại đều đếm trên cây.',r:['f']}
];
const COL={teal:['--teal-f','--teal-s','--teal-t'],coral:['--coral-f','--coral-s','--coral-t'],pur:['--pur-f','--pur-s','--pur-t'],gray:['--gray-f','--gray-s','--gray-t']};
let i=0;
function build(n){const root={it:'root',c:0,ch:[],id:'r',par:null};for(let k=0;k<n;k++){let cur=root;for(const x of T[k]){let nx=cur.ch.find(z=>z.it===x);if(!nx){nx={it:x,c:0,ch:[],id:cur.id+'/'+x,par:cur};cur.ch.push(nx)}nx.c++;cur=nx}}return root}
function layout(root){let leaf=0;const all=[];(function f(n,d){n.d=d;all.push(n);if(!n.ch.length){n.x=leaf++}else{n.ch.forEach(c=>f(c,d+1));n.x=n.ch.reduce((s,c)=>s+c.x,0)/n.ch.length}})(root,0);return{all,leaf}}
function draw(){const s=S[i];const n=s.t==='ins'?s.k:(s.t==='count'?0:5);const root=build(n);const {all,leaf}=layout(root);
const L=Math.max(leaf,1),W=360,sx=x=>L===1?W/2:30+x*(W-60)/(L-1),sy=d=>22+d*46;
const hot=new Set(),tgt=new Set(),pre=new Set();
if(s.t==='ins'){let p='r';T[s.k-1].forEach(x=>{p+='/'+x;hot.add(p)})}
if(s.t==='mine'){all.filter(z=>z.it===s.it).forEach(z=>{tgt.add(z.id);let q=z.par;while(q&&q.it!=='root'){pre.add(q.id);q=q.par}})}
let h='';all.forEach(z=>z.ch.forEach(c=>{const on=pre.has(c.id)||tgt.has(c.id)||hot.has(c.id);h+=`<line x1="${sx(z.x)}" y1="${sy(z.d)}" x2="${sx(c.x)}" y2="${sy(c.d)}" style="stroke:var(--strong);stroke-width:${on?2:1}"/>`}));
all.forEach(z=>{const k=z.it==='root'?'gray':hot.has(z.id)?'teal':tgt.has(z.id)?'coral':pre.has(z.id)?'pur':'gray';const [f,st,tx]=COL[k];const lab=z.it==='root'?'root':z.it+':'+z.c;
h+=`<rect x="${sx(z.x)-21}" y="${sy(z.d)-13}" width="42" height="26" rx="4" style="fill:var(${f});stroke:var(${st})"/><text x="${sx(z.x)}" y="${sy(z.d)}" text-anchor="middle" dominant-baseline="central" style="font-size:13px;font-weight:500;fill:var(${tx})">${lab}</text>`});
const maxd=Math.max(...all.map(z=>z.d));const svg=document.getElementById('tree');svg.setAttribute('viewBox',`0 0 360 ${sy(maxd)+20}`);svg.innerHTML=h;
let tx='';T.forEach((t,k)=>{const cur=s.t==='ins'&&s.k===k+1,done=s.t==='ins'?k<s.k:s.t==='mine';tx+=`<span style="${cur?'border-color:var(--ok);background:var(--ok-bg);color:var(--ok)':done?'':'color:var(--muted)'}">T${k+1}: ${s.t==='count'?RAW[k]:t.join(',')}</span>`});
document.getElementById('tx').innerHTML=tx;
document.getElementById('ttl').textContent=s.ttl;document.getElementById('desc').innerHTML=s.d;
document.getElementById('cnt').textContent=`Bước ${i+1} / ${S.length}`;
const r=[];S.slice(0,i+1).forEach(z=>z.r&&r.push(...z.r.map(x=>'{'+x.split('').join(',')+'}')));document.getElementById('res').textContent=r.length?r.join(' '):'(chưa có)';
document.getElementById('next').textContent=i===S.length-1?'Hết ✓':'Bước tiếp →';}
document.getElementById('next').onclick=()=>{if(i<S.length-1){i++;draw()}};
document.getElementById('prev').onclick=()=>{if(i>0){i--;draw()}};
document.getElementById('reset').onclick=()=>{i=0;draw()};
draw();
</script>
</body>
</html>
